name: Foto de capa (rejeitos)
on:
  push:
    paths: ['.github/workflows/foto-capa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar foto do Wikimedia Commons
        run: |
          curl -fsSL -A "TectonicasSite/1.0 (github.com/tectonicas)" -o novo.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/Vista_do_dep%C3%B3sito_de_rejeitos_da_minera%C3%A7%C3%A3o_em_Serra_Pelada.jpg"
          file novo.jpg | grep -qi jpeg
          if [ ! -f hero-satelite.jpg ]; then git mv hero.jpg hero-satelite.jpg; fi
          mv novo.jpg hero.jpg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Foto de capa: depósito de rejeitos (Hallel, CC BY-SA 4.0)" || echo "sem mudanças"
          git push
